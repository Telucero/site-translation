name: rose-orchestration

on:
  push:
    branches:
      - main
      - master
      - Multi-translation-testing
  workflow_dispatch:
    inputs:
      base_ref_choice:
        description: 'Which branch should be treated as "English baseline"? (choose "custom" to type one below)'
        required: true
        default: 'origin/main'
        type: choice
        options:
          - origin/main
          - main
          - origin/master
          - master
          - origin/english-test
          - english-test
          - origin/Multi-translation-testing
          - Multi-translation-testing
          - HEAD
          - custom
      base_ref_custom:
        description: 'Optional custom English baseline (used only when choice above is "custom")'
        required: false
        default: ''
      head_ref_choice:
        description: 'Which branch/commit contains the new content you want translated? (choose "custom" to type one below)'
        required: true
        default: 'HEAD'
        type: choice
        options:
          - HEAD
          - origin/english-test
          - english-test
          - origin/Multi-translation-testing
          - Multi-translation-testing
          - origin/Multi-translation
          - Multi-translation
          - origin/main
          - main
          - custom
      head_ref_custom:
        description: 'Optional custom content branch/commit (used only when choice above is "custom")'
        required: false
        default: ''
      languages:
        description: 'Two-letter locale codes to translate (separate with spaces, e.g. "es fr pt")'
        required: false
        default: ''
      include_full:
        description: 'Set to true to send full files (even if only a line changed)'
        required: false
        default: 'false'
      file_filter:
        description: 'Optional comma/newline separated list of files to translate (repo-relative paths)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.permission_check.outputs.allowed }}
    steps:
      - name: Verify maintainer permissions
        id: permission_check
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const actor = context.actor;
            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: actor,
            });
            const permission = (data && data.permission) ? data.permission : 'none';
            core.info(`Actor ${actor} has permission level: ${permission}`);
            const allowedPermissions = new Set(['admin', 'maintain']);
            const allowed = allowedPermissions.has(permission) ? 'true' : 'false';
            core.setOutput('allowed', allowed);
      - name: Halt unauthorized dispatch
        if: ${{ steps.permission_check.outputs.allowed != 'true' }}
        run: |
          echo "::warning::${{ github.actor }} is not an admin/maintainer on this repository; skipping pipeline."

  run-pipeline:
    environment: translations
    needs: guard
    if: ${{ needs.guard.outputs.allowed == 'true' }}
    runs-on: ubuntu-latest
    env:
      N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL_TR }}
      ROSE_INCLUDE_FILES: ${{ github.event_name == 'workflow_dispatch' && inputs.file_filter || '' }}
      ROSE_INCLUDE_FULL: ${{ github.event_name == 'workflow_dispatch' && inputs.include_full || '' }}
      ROSE_LANGUAGES: ${{ vars.ROSE_LANGUAGES || 'es fr pt' }}
      ROSE_TRANSLATION_BRANCH: rose/translations/${{ github.run_id }}
    steps:
      - name: Determine translation parameters
        id: refs
        shell: bash
        env:
          BASE_REF_CHOICE: ${{ github.event_name == 'workflow_dispatch' && inputs.base_ref_choice || '' }}
          BASE_REF_CUSTOM: ${{ github.event_name == 'workflow_dispatch' && inputs.base_ref_custom || '' }}
          HEAD_REF_CHOICE: ${{ github.event_name == 'workflow_dispatch' && inputs.head_ref_choice || '' }}
          HEAD_REF_CUSTOM: ${{ github.event_name == 'workflow_dispatch' && inputs.head_ref_custom || '' }}
        run: |
          DEFAULT_LANGS="${ROSE_LANGUAGES:-es fr pt}"
          pick_manual_ref() {
            local choice="$1"
            local custom="$2"
            if [[ -z "$choice" ]]; then
              echo ""
            elif [[ "$choice" == "custom" ]]; then
              echo "$custom"
            else
              echo "$choice"
            fi
          }
          normalize_ref() {
            local ref="$1"
            if [[ -z "$ref" ]]; then
              echo ""
            elif [[ "$ref" == "HEAD" ]]; then
              echo "$ref"
            elif [[ "$ref" =~ ^[0-9a-f]{7,40}$ ]]; then
              echo "$ref"
            elif [[ "$ref" == refs/heads/* ]]; then
              echo "origin/${ref#refs/heads/}"
            elif [[ "$ref" == origin/* ]]; then
              echo "$ref"
            elif [[ "$ref" == refs/* ]]; then
              echo "$ref"
            else
              echo "origin/$ref"
            fi
          }
          raw_base=""
          raw_head=""
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            raw_base="$(pick_manual_ref "${BASE_REF_CHOICE}" "${BASE_REF_CUSTOM}")"
            raw_head="$(pick_manual_ref "${HEAD_REF_CHOICE}" "${HEAD_REF_CUSTOM}")"
            if [[ -z "$raw_base" ]]; then
              echo "::warning::No English baseline selected; defaulting to origin/main"
              raw_base="origin/main"
            fi
            if [[ -z "$raw_head" ]]; then
              echo "::warning::No content branch selected; defaulting to HEAD"
              raw_head="HEAD"
            fi
            diff_base="$(normalize_ref "$raw_base")"
            diff_head="$(normalize_ref "$raw_head")"
            pr_base="$raw_head"
            if [[ -n "${{ inputs.languages }}" ]]; then
              langs="${{ inputs.languages }}"
            else
              langs="$DEFAULT_LANGS"
            fi
          else
            branch="${GITHUB_REF_NAME:-${GITHUB_REF##*/}}"
            diff_base="${{ github.event.before }}"
            if [[ -z "$diff_base" || "$diff_base" == "0000000000000000000000000000000000000000" ]]; then
              diff_base="origin/${branch}"
            fi
            diff_head="HEAD"
            pr_base="${branch}"
            langs="$DEFAULT_LANGS"
            raw_base="$diff_base"
            raw_head="$diff_head"
          fi
          echo "diff_base=$diff_base" >> "$GITHUB_OUTPUT"
          echo "diff_head=$diff_head" >> "$GITHUB_OUTPUT"
          echo "pr_base=$pr_base" >> "$GITHUB_OUTPUT"
          echo "languages=$langs" >> "$GITHUB_OUTPUT"
          echo "raw_base=$raw_base" >> "$GITHUB_OUTPUT"
          echo "raw_head=$raw_head" >> "$GITHUB_OUTPUT"

      # 1) Fetch the repo so the pipeline can diff and modify files.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch manual dispatch refs
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          RAW_BASE: ${{ steps.refs.outputs.raw_base }}
          RAW_HEAD: ${{ steps.refs.outputs.raw_head }}
          DIFF_BASE: ${{ steps.refs.outputs.diff_base }}
          DIFF_HEAD: ${{ steps.refs.outputs.diff_head }}
        run: |
          set -euo pipefail
          fetch_ref() {
            local raw="$1"
            local normalized="$2"
            if [[ -z "$raw" || "$raw" == "HEAD" || "$raw" =~ ^[0-9a-f]{7,40}$ ]]; then
              return
            fi
            if [[ "$normalized" == origin/* ]]; then
              git fetch origin "${normalized#origin/}"
            else
              git fetch origin "$normalized:$normalized"
            fi
          }
          fetch_ref "$RAW_BASE" "$DIFF_BASE"
          fetch_ref "$RAW_HEAD" "$DIFF_HEAD"

      # 2) Install a consistent Python interpreter for all helper scripts.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install translation workflow dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyYAML ruamel.yaml Babel

      # 3) Kick off Rose's orchestrator (diff → n8n → verify → build).
      - name: Run Rose pipeline
        shell: bash
        run: |
          set -euo pipefail

          # Abort early if the webhook secret is missing.
          if [[ -z "${N8N_WEBHOOK_URL:-}" ]]; then
            echo "N8N_WEBHOOK_URL_TR secret is required" >&2
            exit 1
          fi

          LANGS="${{ steps.refs.outputs.languages }}"
          export ROSE_PRESERVE_TRANSLATIONS=1

          CMD=(python translation-workflow/scripts/rose_pipeline.py \
            --base "${{ steps.refs.outputs.diff_base }}" \
            --head "${{ steps.refs.outputs.diff_head }}" \
            --n8n-webhook "$N8N_WEBHOOK_URL")

          # Pass down the language list one by one.
          CMD+=(--languages)
          for lang in $LANGS; do
            CMD+=("$lang")
          done

          echo "Running: ${CMD[*]}"
          "${CMD[@]}"

      - name: Prepare temporary summary directory
        if: ${{ always() }}
        id: temp_summary
        run: |
          TMP_DIR=$(mktemp -d)
          echo "dir=$TMP_DIR" >> "$GITHUB_OUTPUT"

      - name: Generate summary markdown
        if: ${{ always() }}
        shell: bash
        run: |
          SUMMARY_JSON="translation-workflow/translations/summary_report.json"
          SUMMARY_MD="${{ steps.temp_summary.outputs.dir }}/summary.md"
          if [[ ! -f "$SUMMARY_JSON" ]]; then
            echo '{}' > "$SUMMARY_JSON"
          fi
          python translation-workflow/scripts/render_summary.py \
            --summary "$SUMMARY_JSON" \
            --output "$SUMMARY_MD"

      - name: Append translation summary to job summary
        if: ${{ always() }}
        shell: bash
        run: |
          SUMMARY_MD="${{ steps.temp_summary.outputs.dir }}/summary.md"
          if [[ -f "$SUMMARY_MD" ]]; then
            cat "$SUMMARY_MD" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Summary markdown not found; skipping job summary update."
          fi

      - name: Upload translation reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: rose-validation-${{ github.run_id }}
          path: |
            translation-workflow/translations/summary_report.json
            translation-workflow/translations/validation_report.json
            translation-workflow/translations/validation_payload_snapshot.json
            translation-workflow/translations/payload.json
          retention-days: 3
          if-no-files-found: warn

      - name: Cleanup translation artifacts
        if: ${{ always() }}
        run: rm -rf translation-workflow/translations

      - name: Push translation branch
        id: push_branch
        shell: bash
        env:
          TRANSLATION_BRANCH: ${{ env.ROSE_TRANSLATION_BRANCH }}
          COMMIT_MESSAGE: "chore(rose): sync translations for ${{ steps.refs.outputs.languages }}"
        run: |
          set -euo pipefail
          restore_commit="$(git rev-parse HEAD)"
          restore_branch="$(git symbolic-ref --quiet --short HEAD || true)"
          changes="$(git status --porcelain)"
          echo "branch=${TRANSLATION_BRANCH}" >> "$GITHUB_OUTPUT"
          if [[ -z "$changes" ]]; then
            echo "No translation changes detected; skipping branch push."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$TRANSLATION_BRANCH"
          git add -A
          if git diff --cached --quiet; then
            echo "No staged changes to commit; skipping branch push."
            if [[ -n "$restore_branch" ]]; then
              git checkout "$restore_branch"
            else
              git checkout --detach "$restore_commit"
            fi
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "$COMMIT_MESSAGE"
          git push --force-with-lease origin "$TRANSLATION_BRANCH"
          if [[ -n "$restore_branch" ]]; then
            git checkout "$restore_branch"
          else
            git checkout --detach "$restore_commit"
          fi
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Post translation branch instructions
        if: ${{ always() }}
        shell: bash
        env:
          TRANSLATION_BRANCH: ${{ steps.push_branch.outputs.branch }}
          PUSHED: ${{ steps.push_branch.outputs.pushed }}
          BASE_BRANCH: ${{ steps.refs.outputs.pr_base }}
        run: |
          if [[ -z "${TRANSLATION_BRANCH}" ]]; then
            exit 0
          fi
          {
            echo "### Translation branch"
            echo ""
            if [[ "${PUSHED}" == "true" ]]; then
              echo "- Branch with translations: \`${TRANSLATION_BRANCH}\`"
              echo "- Base branch: \`${BASE_BRANCH}\`"
              echo "- Summary file: \`translation-workflow/translations/summary_report.json\`"
              echo ""
              echo "Open a pull request manually from the branch above (automation disabled by request)."
            else
              echo "- No translation changes were committed during this run."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
