name: rose-orchestration

on:
  push:
    branches:
      - main
      - master
      - Multi-translation-testing
  workflow_dispatch:
    inputs:
      base_ref:
        description: 'Which branch/commit should be treated as "English baseline"? (ex: origin/main)'
        required: true
        default: 'origin/main'
      head_ref:
        description: 'Which branch/commit contains the new content you want translated?'
        required: true
        default: 'HEAD'
      languages:
        description: 'Two-letter locale codes to translate (separate with spaces, e.g. "es fr pt")'
        required: false
        default: ''
      include_full:
        description: 'Set to true to send full files (even if only a line changed)'
        required: false
        default: 'false'
      pr_number:
        description: 'Optional PR number to post the summary comment to'
        required: false
        default: ''
      file_filter:
        description: 'Optional comma/newline separated list of files to translate (repo-relative paths)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.permission_check.outputs.allowed }}
    steps:
      - name: Verify maintainer permissions
        id: permission_check
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const actor = context.actor;
            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: actor,
            });
            const permission = (data && data.permission) ? data.permission : 'none';
            core.info(`Actor ${actor} has permission level: ${permission}`);
            const allowedPermissions = new Set(['admin', 'maintain']);
            const allowed = allowedPermissions.has(permission) ? 'true' : 'false';
            core.setOutput('allowed', allowed);
      - name: Halt unauthorized dispatch
        if: ${{ steps.permission_check.outputs.allowed != 'true' }}
        run: |
          echo "::warning::${{ github.actor }} is not an admin/maintainer on this repository; skipping pipeline."

  run-pipeline:
    environment: translations
    needs: guard
    if: ${{ needs.guard.outputs.allowed == 'true' }}
    runs-on: ubuntu-latest
    env:
      N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL_TR }}
      ROSE_INCLUDE_FILES: ${{ github.event_name == 'workflow_dispatch' && inputs.file_filter || '' }}
      ROSE_INCLUDE_FULL: ${{ github.event_name == 'workflow_dispatch' && inputs.include_full || '' }}
      ROSE_LANGUAGES: ${{ vars.ROSE_LANGUAGES || 'es fr pt' }}
    steps:
      - name: Determine translation parameters
        id: refs
        shell: bash
        run: |
          DEFAULT_LANGS="${ROSE_LANGUAGES:-es fr pt}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            diff_base="${{ inputs.base_ref }}"
            diff_head="${{ inputs.head_ref }}"
            pr_base="${{ inputs.head_ref }}"
            pr_number="${{ inputs.pr_number }}"
            if [[ -n "${{ inputs.languages }}" ]]; then
              langs="${{ inputs.languages }}"
            else
              langs="$DEFAULT_LANGS"
            fi
          else
            branch="${GITHUB_REF_NAME:-${GITHUB_REF##*/}}"
            diff_base="${{ github.event.before }}"
            if [[ -z "$diff_base" || "$diff_base" == "0000000000000000000000000000000000000000" ]]; then
              diff_base="origin/${branch}"
            fi
            diff_head="HEAD"
            pr_base="${branch}"
            pr_number=""
            langs="$DEFAULT_LANGS"
          fi
          echo "diff_base=$diff_base" >> "$GITHUB_OUTPUT"
          echo "diff_head=$diff_head" >> "$GITHUB_OUTPUT"
          echo "pr_base=$pr_base" >> "$GITHUB_OUTPUT"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "languages=$langs" >> "$GITHUB_OUTPUT"

      # 1) Fetch the repo so the pipeline can diff and modify files.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2) Install a consistent Python interpreter for all helper scripts.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install translation workflow dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyYAML ruamel.yaml Babel

      # 3) Kick off Rose's orchestrator (diff → n8n → verify → build).
      - name: Run Rose pipeline
        shell: bash
        run: |
          set -euo pipefail

          # Abort early if the webhook secret is missing.
          if [[ -z "${N8N_WEBHOOK_URL:-}" ]]; then
            echo "N8N_WEBHOOK_URL_TR secret is required" >&2
            exit 1
          fi

          LANGS="${{ steps.refs.outputs.languages }}"

          CMD=(python translation-workflow/scripts/rose_pipeline.py \
            --base "${{ steps.refs.outputs.diff_base }}" \
            --head "${{ steps.refs.outputs.diff_head }}" \
            --n8n-webhook "$N8N_WEBHOOK_URL")

          # Pass down the language list one by one.
          CMD+=(--languages)
          for lang in $LANGS; do
            CMD+=("$lang")
          done

          echo "Running: ${CMD[*]}"
          "${CMD[@]}"

      - name: Prepare temporary summary directory
        if: ${{ always() }}
        id: temp_summary
        run: |
          TMP_DIR=$(mktemp -d)
          echo "dir=$TMP_DIR" >> "$GITHUB_OUTPUT"

      - name: Generate summary markdown
        if: ${{ always() }}
        shell: bash
        run: |
          SUMMARY_JSON="${{ steps.temp_summary.outputs.dir }}/summary_report.json"
          SUMMARY_MD="${{ steps.temp_summary.outputs.dir }}/summary.md"
          if [[ ! -f "$SUMMARY_JSON" ]]; then
            echo '{}' > "$SUMMARY_JSON"
          fi
          python translation-workflow/scripts/render_summary.py \
            --summary "$SUMMARY_JSON" \
            --output "$SUMMARY_MD"

      - name: Append translation summary to job summary
        if: ${{ always() }}
        shell: bash
        run: |
          SUMMARY_MD="${{ steps.temp_summary.outputs.dir }}/summary.md"
          if [[ -f "$SUMMARY_MD" ]]; then
            cat "$SUMMARY_MD" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Summary markdown not found; skipping job summary update."
          fi

      - name: Create translation pull request
        id: create_pr
        if: ${{ steps.refs.outputs.pr_number == '' }}
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(rose): sync translations for ${{ steps.refs.outputs.languages }}"
          title: "chore(rose): sync translations for ${{ steps.refs.outputs.languages }}"
          body-path: ${{ steps.temp_summary.outputs.dir }}/summary.md
          branch: rose/translations/${{ github.run_id }}
          base: ${{ steps.refs.outputs.pr_base }}
          draft: false
          delete-branch: true

      - name: Resolve PR number for reporting
        if: ${{ always() }}
        id: pr_target
        shell: bash
        run: |
          pr_number="${{ steps.refs.outputs.pr_number }}"
          created="${{ steps.create_pr.outputs.pull-request-number }}"
          if [[ -z "$pr_number" && -n "$created" ]]; then
            pr_number="$created"
          fi
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Comment on PR with summary
        if: ${{ always() && steps.pr_target.outputs.number != '' }}
        uses: actions/github-script@v7
        env:
          SUMMARY_MD_PATH: ${{ steps.temp_summary.outputs.dir }}/summary.md
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const summaryPath = process.env.SUMMARY_MD_PATH;
            if (!fs.existsSync(summaryPath)) {
              core.info('Summary markdown not found; skipping PR comment.');
              return;
            }
            const body = fs.readFileSync(summaryPath, 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number('${{ steps.pr_target.outputs.number }}'),
              body,
            });

      - name: Inline validation review comments
        if: ${{ always() && steps.pr_target.outputs.number != '' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const reportPath = 'translation-workflow/translations/validation_report.json';
            if (!fs.existsSync(reportPath)) {
              core.info('Validation report not found; skipping inline comments.');
              return;
            }
            const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
            if (!report.issues || report.issues.length === 0) {
              core.info('No validation issues detected; no inline comments to post.');
              return;
            }
            const prNumber = Number('${{ steps.pr_target.outputs.number }}');
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            const commitId = pr.head.sha;
            let comments = 0;
            for (const issue of report.issues) {
              if (comments >= 20) {
                core.info('Reached inline comment cap (20).');
                break;
              }
              const filePath = issue.target_path || issue.source_path;
              if (!filePath) {
                continue;
              }
              const line = issue.line || 1;
              const messageParts = [
                `**${issue.issue_type || 'validation_issue'}**`,
                issue.message || 'See validation report for details.',
              ];
              if (issue.details && Object.keys(issue.details).length) {
                messageParts.push('', '```json', JSON.stringify(issue.details, null, 2), '```');
              }
              try {
                await github.rest.pulls.createReviewComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prNumber,
                  commit_id: commitId,
                  path: filePath,
                  line,
                  side: 'RIGHT',
                  body: messageParts.join('\n'),
                });
                comments += 1;
              } catch (error) {
                core.warning(`Unable to post inline validation comment for ${filePath}:${line} - ${error.message}`);
              }
            }
            if (comments === 0) {
              core.info('Inline validation comments skipped (no eligible paths/lines).');
            }
